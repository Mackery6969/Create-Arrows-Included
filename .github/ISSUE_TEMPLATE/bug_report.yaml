name: Bug Report
description: Use this form to file a bug report for Create: Arrows Included.
labels: [ "bug", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Before posting please check if the bug has already been reported.
  - type: markdown
    attributes:
      value: |
        Please complete the following information:
  - type: input
    id: mod-version
    attributes:
      label: Arrows Included version
    validations:
      required: true
  - type: input
    id: create-version
    attributes:
      label: Create version
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and desktop
      description: e.g. Fedora 44 / KDE Plasma, Windows 11
  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug. Mention which menu or item you were using.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What should have happened instead?
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: crash-log
    attributes:
      label: Crash log (if applicable)
      description: Please provide a link to the crash log or paste it here.
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      placeholder: Add any other context about the problem here.
