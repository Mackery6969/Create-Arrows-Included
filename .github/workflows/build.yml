name: Build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - 'updates.json'
      - '.gitignore'
      - '.editorconfig'

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Compute artifact name
        id: artifact
        env:
          RAW: ${{ github.head_ref || github.ref_name }}
        run: echo "name=${RAW//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{ steps.artifact.outputs.name }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  submit:
    name: Submit Gradle Dependencies
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
