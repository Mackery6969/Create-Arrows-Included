plugins {
	id 'net.neoforged.moddev'
	id 'java-library'
	id 'maven-publish'
	id 'idea'
}

def mod_major_version = mod_version.tokenize('.')[0]

version = mod_version
group = mod_group_id

base {
	archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Building ${mod_id} ${mod_version} for Minecraft ${minecraft_version} (NeoForge ${neo_version})"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()
			gameDirectory = file("runs/client")

			// Hot-Swapping via JBR, includes schema changes
			jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

			systemProperty("mixin.debug.export", "true")
			systemProperty("mixin.debug.verbose", "true")
		}

		configureEach {
			systemProperty('neoforge.logging.markers', 'REGISTRIES')
			systemProperty('terminal.jline', 'true') // enable interactive & colored terminal features

			logLevel = org.slf4j.event.Level.DEBUG
			systemProperty("neoforge.logging.console.level", "debug") //force debug level with system property
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version, neo_version_range: neo_version_range,
			loader_version_range   : loader_version_range,
			create_version_range   : create_version_range,

			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description,
			mod_url                : mod_url,
			mod_issue_url          : mod_issue_url,
			mod_update_url         : mod_update_url
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

jar {
	manifest.attributes([
			'Specification-Title'     : mod_name,
			'Specification-Vendor'    : mod_vendor,
			'Specification-Version'   : mod_major_version,
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.jar.archiveVersion,
			'Implementation-Vendor'   : mod_vendor,
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
	])

	//copy files from the repository root into the jar
	from(layout.projectDirectory) {
		include 'LICENSE.txt'
	}
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url = layout.projectDirectory.dir("repo").asFile.toURI()
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
